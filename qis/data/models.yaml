# Tiers pick models by VRAM (qis.engine.hardware.choose_tier). `quality` swaps in the larger turbo when it fits.
profiles:
  T0:
    title: "Tools only (< 6 GB / no NVIDIA GPU)"
    models: [realesrgan-x2, realesrgan-x4]
    comfy: {reserve_vram: 0}
  T1:
    title: "6-8 GB: turbo Q4_K_M + base Q4_K_M"
    models: [turbo-q4km, base-q4km, encoder-int8, vae, realesrgan-x2, realesrgan-x4]
    quality: {turbo: turbo-q6k}
    fast: {drop: [base-q4km]}
    comfy: {reserve_vram: 1.2}
  T2:
    title: "10-12 GB: turbo Q8_0 + base Q4_K_M"
    models: [turbo-q8, base-q4km, encoder-int8, vae, realesrgan-x2, realesrgan-x4]
    fast: {turbo: turbo-q6k}
    comfy: {reserve_vram: 1.0}
  T3:
    title: "16 GB: turbo Q8_0 + base Q8_0"
    models: [turbo-q8, base-q4km, base-q8, encoder-int8, vae, realesrgan-x2, realesrgan-x4]
    comfy: {reserve_vram: 1.0}
  T4:
    title: "24 GB: Q8_0, text encoder resident in VRAM"
    models: [turbo-q8, base-q4km, base-q8, encoder-int8, vae, realesrgan-x2, realesrgan-x4]
    comfy: {reserve_vram: 1.5}
  T5:
    title: ">= 32 GB: Q8_0 everywhere, room for batching"
    models: [turbo-q8, base-q4km, base-q8, encoder-int8, vae, realesrgan-x2, realesrgan-x4]
    comfy: {reserve_vram: 2.0}

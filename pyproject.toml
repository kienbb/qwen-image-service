[project]
name = "qwen-image-service"
version = "0.1.0"
description = "Installable Qwen-Image 2.1 node: OpenAI-compatible image API, queue, dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=13",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "pillow>=10.3",
    "numpy>=1.26",
    "pyyaml>=6",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "nvidia-ml-py>=12.535",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "openai>=1.40"]

[project.scripts]
qis = "qis.cli:main"
qis-gateway = "qis.cli:serve_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qis"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["qis/comfy_nodes", "ComfyUI_windows_portable", "downloads", "output", "web", "tests/golden/legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["gpu: needs a real ComfyUI with the Qwen-Image models (run with -m gpu)"]
addopts = "-m 'not gpu'"
